<svg width="500" height="850" viewBox="0 0 500 850" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titaniumFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A880" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#F3E7D3" />
      <stop offset="50%" stop-color="#8C7352" />
      <stop offset="75%" stop-color="#E2D0B8" />
      <stop offset="100%" stop-color="#6B5539" />
    </linearGradient>
    <linearGradient id="screenDisplay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="35%" stop-color="#0c172e" />
      <stop offset="70%" stop-color="#142c54" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>
    <linearGradient id="glowEffect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A880" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0071e3" stop-opacity="0" />
    </linearGradient>
    <filter id="blurShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect x="70" y="70" width="360" height="710" rx="60" fill="url(#glowEffect)" filter="url(#blurShadow)" />

  <!-- Outer Grade 5 Titanium Chassis -->
  <rect x="48" y="48" width="404" height="754" rx="58" fill="url(#titaniumFrame)" stroke="#382E22" stroke-width="2" />

  <!-- Inner Black Border & Ceramic Shield Screen -->
  <rect x="56" y="56" width="388" height="738" rx="50" fill="#000000" />
  <rect x="62" y="62" width="376" height="726" rx="44" fill="url(#screenDisplay)" />

  <!-- Dynamic Island Pill -->
  <rect x="185" y="80" width="130" height="34" rx="17" fill="#000000" />
  <circle cx="288" cy="97" r="6" fill="#111827" />
  <circle cx="288" cy="97" r="3" fill="#0284c7" opacity="0.6" />

  <!-- Screen Content Graphic: 18 Pro Max -->
  <circle cx="250" cy="390" r="120" stroke="#C5A880" stroke-width="1.5" opacity="0.25" stroke-dasharray="6 6" />
  <circle cx="250" cy="390" r="95" fill="#C5A880" opacity="0.08" />
  
  <text x="250" y="375" fill="#ffffff" font-size="44" font-weight="800" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" text-anchor="middle" letter-spacing="-1">18 PRO</text>
  <text x="250" y="415" fill="#C5A880" font-size="18" font-weight="700" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" text-anchor="middle" letter-spacing="6">MAX</text>

  <rect x="175" y="445" width="150" height="26" rx="13" fill="#ffffff" fill-opacity="0.1" />
  <text x="250" y="463" fill="#E2D0B8" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', system-ui, sans-serif" text-anchor="middle">A19 PRO • 6.9″ DISPLAY</text>

  <!-- Screen Reflection Highlight -->
  <path d="M 64 64 L 300 64 L 64 600 Z" fill="#ffffff" opacity="0.04" />

  <!-- Home Indicator Bar -->
  <rect x="170" y="764" width="160" height="5" rx="2.5" fill="#ffffff" opacity="0.7" />
</svg>
