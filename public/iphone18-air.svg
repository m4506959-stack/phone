<svg width="490" height="830" viewBox="0 0 490 830" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="airFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7998B5" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#CDE2F5" />
      <stop offset="60%" stop-color="#557594" />
      <stop offset="100%" stop-color="#37526C" />
    </linearGradient>
    <linearGradient id="airDisplay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C16" />
      <stop offset="40%" stop-color="#0E2138" />
      <stop offset="80%" stop-color="#193B63" />
      <stop offset="100%" stop-color="#050C16" />
    </linearGradient>
    <linearGradient id="airGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7998B5" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <filter id="airShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <rect x="65" y="65" width="360" height="700" rx="55" fill="url(#airGlow)" filter="url(#airShadow)" />

  <!-- Ultra Thin Frame -->
  <rect x="46" y="46" width="398" height="738" rx="56" fill="url(#airFrame)" stroke="#263E56" stroke-width="1.5" />
  <rect x="52" y="52" width="386" height="726" rx="50" fill="#000000" />
  <rect x="56" y="56" width="378" height="718" rx="46" fill="url(#airDisplay)" />

  <rect x="180" y="72" width="130" height="32" rx="16" fill="#000000" />
  <circle cx="280" cy="88" r="5" fill="#111827" />

  <circle cx="245" cy="385" r="110" stroke="#7998B5" stroke-width="1.5" opacity="0.3" stroke-dasharray="3 3" />
  <text x="245" y="375" fill="#ffffff" font-size="42" font-weight="800" font-family="'Plus Jakarta Sans', system-ui, sans-serif" text-anchor="middle" letter-spacing="-1">18 AIR</text>
  <text x="245" y="410" fill="#7998B5" font-size="14" font-weight="700" font-family="'Plus Jakarta Sans', system-ui, sans-serif" text-anchor="middle" letter-spacing="6">ULTRA THIN</text>

  <rect x="165" y="440" width="160" height="24" rx="12" fill="#ffffff" fill-opacity="0.1" />
  <text x="245" y="457" fill="#CDE2F5" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', system-ui, sans-serif" text-anchor="middle">5.6MM SLIM • 6.6″ DISPLAY</text>

  <rect x="165" y="754" width="160" height="5" rx="2.5" fill="#ffffff" opacity="0.7" />
</svg>
